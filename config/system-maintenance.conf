# true: komutları gösterir ama sistemi değiştirmez. Kurulumdan önce elle test için kullanın.
DRY_RUN=false

UPDATE_PACKAGES=true
UPDATE_DOCKER_IMAGES=true
PRUNE_DOCKER_IMAGES=true
PRUNE_DOCKER_BUILD_CACHE=true

# systemd journal sınırları
JOURNAL_RETENTION=14d
JOURNAL_MAX_SIZE=500M

# Yeni indirilen/eski imajların hemen silinmesini engelleyen güvenlik eşiği
DOCKER_IMAGE_MIN_AGE_HOURS=24
DOCKER_BUILD_CACHE_MIN_AGE_HOURS=168
