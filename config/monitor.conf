# HTTPS listener and certificate paths.
LISTEN=0.0.0.0:8443
TLS_CERT=/etc/system-maintenance/tls/server.crt
TLS_KEY=/etc/system-maintenance/tls/server.key

# Only direct peers in these networks may access the application.
ALLOWED_CIDRS=127.0.0.1/32,::1/128,192.168.2.0/24
TRUSTED_PROXIES=

# Linux identity and local service boundaries.
ADMIN_GROUP=system-maintenance-admin
AGENT_GROUP=system-maintenance-agent
WEB_USER=system-maintenance
PAM_SERVICE=system-maintenance
AGENT_SOCKET=/run/system-maintenance/agent.sock
NETWORK_BPF_OBJECT=/opt/system-maintenance/lib/network_accounting.bpf.o
DATA_DIR=/var/lib/system-maintenance-monitor

# Privileged operations must remain explicitly allowlisted.
SERVICE_ALLOWLIST=system-maintenance.service
PROTECTED_SERVICES=system-maintenance-monitor.service,system-maintenance-agent.service,ssh.service,sshd.service,systemd-logind.service,NetworkManager.service,systemd-networkd.service
JOB_EXECUTABLES=/opt/system-maintenance/bin/system-maintenance
MAINTENANCE_SERVICE=system-maintenance.service

# Historical database limit. Raw metrics are retained for 30 days and rollups for one year.
MAX_DATABASE_MB=2048

# Fast CPU, memory, process and network refresh rate.
SAMPLE_INTERVAL=1s

# System package inventory and repository metadata refresh policy.
PACKAGE_SCAN_INTERVAL=15m
PACKAGE_METADATA_REFRESH_INTERVAL=12h
PACKAGE_EVENT_RETENTION_DAYS=365
